<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamKanban Login</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="login-shell"><section class="login-card"><div class="brand"> TeamKanban</div><h1>Welcome back</h1><p>Sign in to your project workspace.</p><form id="loginForm"><label>Email<input id="email" type="email" value="pranathi@teamkanban.local" required></label><label>Password<input id="password" type="password" value="password" required></label><button class="primary" type="submit">Sign in</button><div id="loginError" class="error"></div></form><small>Demo account: pranathi@teamkanban.local / password</small></section></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)return loginError.textContent=d.error||'Login failed';localStorage.setItem('tk_token',d.token);location.href='/';});</script></body></html>
