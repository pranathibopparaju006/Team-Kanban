name: MySQL integration tests

on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mysql-integration.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mysql-integration.yml"

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: teamkanban_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: teamkanban_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Socket.IO integration client
        run: npm install --no-save --package-lock=false socket.io-client@4.8.1
      - name: Run all automated checks
        run: npm run check
