name: Node.js checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Socket.IO test client
        run: npm install --no-save --package-lock=false socket.io-client@4.8.1
      - name: Run syntax and integration checks
        run: npm run check
